<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Bancario SIF — Cajas Populares México</title>
  <meta name="description" content="Sistema de Información Financiera para Cajas Populares en México. Gestión de socios, captación, crédito, caja y contabilidad." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <style>
    :root {
      --color-bg-dark: #0d1117;
      --color-bg-card: #161b22;
      --color-bg-surface: #1c2333;
      --color-border: #30363d;
      --color-primary: #1a6b8a;
      --color-primary-light: #1e88b0;
      --color-primary-glow: rgba(26, 107, 138, 0.3);
      --color-gold: #c9a84c;
      --color-gold-light: #e4c876;
      --color-gold-glow: rgba(201, 168, 76, 0.25);
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --color-danger: #dc3545;
      --color-danger-bg: rgba(220,53,69,0.15);
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-family: 'Inter', sans-serif;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--color-bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Background animado */
    .bg-animated {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(26,107,138,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.1) 0%, transparent 50%),
                  radial-gradient(ellipse at 60% 80%, rgba(26,107,138,0.08) 0%, transparent 50%);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Login Card */
    .login-container {
      position: relative; z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card {
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-gold) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 24px var(--color-gold-glow), 0 0 40px var(--color-primary-glow);
      flex-shrink: 0;
    }
    .login-logo-name {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, var(--text-primary), var(--color-gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .login-logo-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    .login-title {
      font-size: 26px; font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .login-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .form-input-wrap { position: relative; }
    .form-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px; color: var(--text-muted);
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px 14px 12px 44px;
      color: var(--text-primary);
      font-size: 14px; font-family: var(--font-family);
      outline: none;
      transition: var(--transition);
    }
    .form-control:focus {
      border-color: var(--color-primary-light);
      box-shadow: 0 0 0 3px var(--color-primary-glow);
      background: rgba(28, 35, 51, 0.8);
    }
    .form-control::placeholder { color: var(--text-muted); }

    .toggle-password {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 16px;
      padding: 4px;
      transition: var(--transition);
    }
    .toggle-password:hover { color: var(--text-primary); }

    .login-options {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; font-size: 13px;
    }
    .checkbox-label {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-secondary); cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] { accent-color: var(--color-primary-light); }
    .forgot-link { color: var(--color-primary-light); text-decoration: none; font-size: 13px; }
    .forgot-link:hover { color: var(--color-gold); }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      border: none; border-radius: var(--radius-md);
      color: white; font-size: 15px; font-weight: 700; font-family: var(--font-family);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 20px var(--color-primary-glow);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.3px;
    }
    .btn-login:hover { filter: brightness(1.2); transform: translateY(-1px); box-shadow: 0 8px 30px var(--color-primary-glow); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .login-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .login-footer strong { color: var(--text-secondary); }

    .error-msg {
      background: var(--color-danger-bg);
      border: 1px solid var(--color-danger);
      color: #ff6b7a;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .error-msg.show { display: flex; }

    /* Indicador de estado del servidor */
    .server-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-muted);
      margin-top: 12px; justify-content: center;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--color-gold);
      animation: pulse 2s infinite;
    }
    .status-dot.online { background: #28a745; }
    .status-dot.offline { background: var(--color-danger); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bg-animated"></div>
  <div class="bg-grid"></div>

  <div class="login-container">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-icon">🏦</div>
        <div>
          <div class="login-logo-name">SIF — Core Bancario</div>
          <div class="login-logo-sub">Cajas Populares México</div>
        </div>
      </div>

      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-desc">Ingresa tus credenciales para acceder al sistema financiero</p>

      <!-- Error -->
      <div class="error-msg" id="errorMsg">
        <span>⚠️</span>
        <span id="errorText">Usuario o contraseña incorrectos</span>
      </div>

      <!-- Formulario -->
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <div class="form-input-wrap">
            <span class="form-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              placeholder="Ingresa tu usuario"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="form-input-wrap">
            <span class="form-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="••••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-password" id="togglePwd" title="Mostrar/ocultar contraseña">👁️</button>
          </div>
        </div>

        <div class="login-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" />
            Recordarme
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <div class="spinner" id="loginSpinner"></div>
          <span id="btnText">🚀 Entrar al sistema</span>
        </button>
      </form>

      <div class="login-footer">
        <div class="server-status">
          <div class="status-dot" id="serverDot"></div>
          <span id="serverLabel">Verificando conexión...</span>
        </div>
        <p style="margin-top:12px">
          <strong>Core Bancario SIF v1.0</strong> · Cajas Populares de México<br />
          SQL Server 2022 · 172.28.5.231
        </p>
      </div>
    </div>
  </div>

  <script>
    const API = '';

    // Verificar estado del servidor
    async function checkServer() {
      try {
        const r = await fetch(`${API}/api/health`, { signal: AbortSignal.timeout(5000) });
        const dot = document.getElementById('serverDot');
        const label = document.getElementById('serverLabel');
        if (r.ok) {
          dot.className = 'status-dot online';
          label.textContent = 'Servidor en línea · SQL Server 2022';
        } else {
          dot.className = 'status-dot offline';
          label.textContent = 'Servidor no disponible';
        }
      } catch {
        const dot = document.getElementById('serverDot');
        const label = document.getElementById('serverLabel');
        dot.className = 'status-dot offline';
        label.textContent = 'Sin conexión al servidor';
      }
    }
    checkServer();

    // Toggle contraseña
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      const btn = document.getElementById('togglePwd');
      if (pwd.type === 'password') { pwd.type = 'text'; btn.textContent = '🙈'; }
      else { pwd.type = 'password'; btn.textContent = '👁️'; }
    });

    // Formulario de login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const spinner = document.getElementById('loginSpinner');
      const btnText = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');

      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = 'Autenticando...';
      errorMsg.classList.remove('show');

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('sif_token', data.token);
          localStorage.setItem('sif_user', JSON.stringify(data.user));
          btnText.textContent = '✅ Acceso concedido...';
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
        } else {
          throw new Error(data.message || 'Credenciales incorrectas');
        }
      } catch (err) {
        document.getElementById('errorText').textContent = err.message;
        errorMsg.classList.add('show');
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = '🚀 Entrar al sistema';
      }
    });

    // Si ya hay sesión, redirigir
    if (localStorage.getItem('sif_token')) {
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
